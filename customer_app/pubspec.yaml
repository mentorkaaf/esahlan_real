name: com.esahlan.app
description: eSahlan - Everything You Need, Simplified
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Network
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Local Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fluttertoast: ^8.2.12
  smooth_page_indicator: ^1.2.0+3
  carousel_slider: ^5.0.0
  badges: ^3.1.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2

  # Maps & Location
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  workmanager: ^0.9.0
  geocoding: ^3.0.0

  # Video
  video_player: ^2.9.2
  chewie: ^1.8.5
  better_player_plus: ^1.2.1
  visibility_detector: ^0.4.0+2
  video_compress: ^3.1.3
  youtube_player_flutter: ^10.0.1
  webview_flutter: ^4.10.0

  # Files & Audio
  file_picker: ^8.0.0+1
  audioplayers: ^6.1.0
  audio_waveforms: ^1.2.0

  # Image
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.20.1
  timeago: ^3.7.0
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.3
  permission_handler: ^11.4.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/sounds/
