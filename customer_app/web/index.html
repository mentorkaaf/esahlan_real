<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Everything You Need, Simplified — Somalia's Super App">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- PWA: Android -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#07003B">

  <!-- PWA: iOS (Add to Home Screen) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="eSahlan">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>eSahlan</title>
  <link rel="manifest" href="manifest.json">

  <style>
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .pwa-sheet {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 999999;
      background: #07003B;
      color: #fff;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      animation: slideUp 0.38s cubic-bezier(0.32,0.72,0,1);
      padding: 24px 20px;
      padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
      max-height: 85vh;
      overflow-y: auto;
      box-sizing: border-box;
      -webkit-overflow-scrolling: touch;
    }

    /* Shared banner row (icon + text) */
    .banner-row {
      display: flex; align-items: center; gap: 14px; margin-bottom: 18px;
    }
    .banner-row img {
      width: 58px; height: 58px; border-radius: 14px; flex-shrink: 0;
    }
    .banner-row strong {
      display: block; font-size: 18px; font-weight: 800; letter-spacing: -0.3px;
    }
    .banner-row span {
      display: block; font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 3px;
    }

    /* Shared install button style */
    .install-btn {
      display: block; width: 100%;
      background: #F5A623; color: #07003B;
      border: none; border-radius: 14px;
      padding: 16px; font-size: 16px; font-weight: 800;
      cursor: pointer; box-sizing: border-box;
    }

    /* iOS: small hint shown below button after tap (share sheet reminder) */
    #ios-hint {
      display: none;
      margin-top: 14px;
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      color: rgba(255,255,255,0.75);
      line-height: 1.5;
      text-align: center;
    }
    #ios-hint b { color: #F5A623; }

    /* Dim overlay */
    #pwa-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999998;
      background: rgba(0,0,0,0.6);
    }

    /* Post-install full-screen */
    #installed-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999999;
      background: #07003B;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }
    #installed-overlay img {
      width: 90px; height: 90px; border-radius: 22px; margin-bottom: 28px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    #installed-overlay h2 { font-size: 24px; font-weight: 800; margin: 0 0 14px; }
    #installed-overlay p  { font-size: 15px; color: rgba(255,255,255,0.7); line-height: 1.7; margin: 0; }
    #installed-overlay .chip {
      display: inline-block; margin-top: 24px;
      background: #F5A623; color: #07003B;
      border-radius: 30px; padding: 10px 24px;
      font-size: 14px; font-weight: 800;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>

  <div id="pwa-overlay"></div>

  <!-- Post-install screen -->
  <div id="installed-overlay">
    <img src="icons/Icon-192.png" alt="eSahlan">
    <h2>eSahlan Installed! 🎉</h2>
    <p>Please open eSahlan from your<br>home screen icon to continue.</p>
    <div class="chip">📱 Open from Home Screen</div>
  </div>

  <!-- Android Chrome install banner -->
  <div id="android-banner" class="pwa-sheet">
    <div class="banner-row">
      <img src="icons/Icon-192.png" alt="eSahlan">
      <div>
        <strong>eSahlan</strong>
        <span>Somalia's Super App — Order food,<br>shop, parcel &amp; more.</span>
      </div>
    </div>
    <button id="android-install-btn" class="install-btn">⬇️ &nbsp; Install App</button>
  </div>

  <!-- iOS banner — same design, button triggers native share sheet -->
  <div id="ios-banner" class="pwa-sheet">
    <div class="banner-row">
      <img src="icons/Icon-192.png" alt="eSahlan">
      <div>
        <strong>eSahlan</strong>
        <span>Somalia's Super App — Order food,<br>shop, parcel &amp; more.</span>
      </div>
    </div>
    <button id="ios-install-btn" class="install-btn">⬇️ &nbsp; Add to Home Screen</button>
    <div id="ios-hint">
      Share sheet-ka ku furmi doona — <b>"Add to Home Screen"</b> taabo
    </div>
  </div>

  <script>
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches
                    || window.navigator.standalone === true;

    function isMobile() {
      return /android|iphone|ipad|ipod/i.test(navigator.userAgent);
    }
    function isIOS() {
      return /iphone|ipad|ipod/i.test(navigator.userAgent);
    }
    function showOverlay() {
      document.getElementById('pwa-overlay').style.display = 'block';
    }

    if (isMobile() && !isStandalone) {

      // ── Android Chrome ──────────────────────────────────────────────────
      var deferredPrompt = null;

      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        deferredPrompt = e;
        showOverlay();
        document.getElementById('android-banner').style.display = 'block';
      });

      document.getElementById('android-install-btn').addEventListener('click', function() {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(r) {
          deferredPrompt = null;
          if (r.outcome === 'accepted') {
            document.getElementById('android-banner').style.display = 'none';
            document.getElementById('pwa-overlay').style.display = 'none';
          }
        });
      });

      // ── iOS — button opens native share sheet ───────────────────────────
      if (isIOS()) {
        showOverlay();
        document.getElementById('ios-banner').style.display = 'block';

        document.getElementById('ios-install-btn').addEventListener('click', function() {
          // Try Web Share API — opens native iOS share sheet
          if (navigator.share) {
            navigator.share({
              title: 'eSahlan',
              text: "Somalia's Super App",
              url: window.location.href,
            }).catch(function() {
              // User cancelled or share failed — show text hint
              document.getElementById('ios-hint').style.display = 'block';
            });
          } else {
            // Older iOS without Web Share — show hint
            document.getElementById('ios-hint').style.display = 'block';
          }
        });
      }
    }

    // After Android install — block browser, force home screen
    window.addEventListener('appinstalled', function() {
      document.getElementById('android-banner').style.display = 'none';
      document.getElementById('pwa-overlay').style.display = 'none';
      document.getElementById('installed-overlay').style.display = 'flex';
    });
  </script>
</body>
</html>
