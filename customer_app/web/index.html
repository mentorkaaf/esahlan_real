<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Everything You Need, Simplified — Somalia's Super App">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#07003B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="eSahlan">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>eSahlan</title>
  <link rel="manifest" href="manifest.json">

  <style>
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245,166,35,0); }
      50%       { box-shadow: 0 0 0 8px rgba(245,166,35,0.35); }
    }

    .pwa-sheet {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 999999;
      background: #07003B;
      color: #fff;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      animation: slideUp 0.38s cubic-bezier(0.32,0.72,0,1);
      padding: 24px 20px;
      padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      box-sizing: border-box;
    }

    /* Shared banner header */
    .banner-row {
      display: flex; align-items: center; gap: 14px; margin-bottom: 18px;
    }
    .banner-row img {
      width: 56px; height: 56px; border-radius: 14px; flex-shrink: 0;
    }
    .banner-row strong { display: block; font-size: 17px; font-weight: 800; }
    .banner-row span   { display: block; font-size: 12px; color: rgba(255,255,255,0.55); margin-top: 2px; }

    /* Android install button */
    .install-btn {
      display: block; width: 100%;
      background: #F5A623; color: #07003B;
      border: none; border-radius: 14px;
      padding: 15px; font-size: 16px; font-weight: 800;
      cursor: pointer; box-sizing: border-box;
    }

    /* iOS instruction card */
    .ios-instruction {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 16px;
    }
    .ios-tap-icon {
      width: 48px; height: 48px; flex-shrink: 0;
      border-radius: 12px;
      background: rgba(245,166,35,0.15);
      border: 2px solid rgba(245,166,35,0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      animation: pulse 2s ease-in-out infinite;
    }
    .ios-instr-text {
      font-size: 15px;
      line-height: 1.55;
      color: rgba(255,255,255,0.9);
    }
    .ios-instr-text b { color: #F5A623; }

    /* Dim overlay */
    #pwa-overlay {
      display: none; position: fixed; inset: 0;
      z-index: 999998; background: rgba(0,0,0,0.65);
    }

    /* Post-install screen */
    #installed-overlay {
      display: none; position: fixed; inset: 0;
      z-index: 9999999; background: #07003B; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 40px 24px;
    }
    #installed-overlay img {
      width: 90px; height: 90px; border-radius: 22px;
      margin-bottom: 28px; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    #installed-overlay h2 { font-size: 24px; font-weight: 800; margin: 0 0 14px; }
    #installed-overlay p  { font-size: 15px; color: rgba(255,255,255,0.7); line-height: 1.7; margin: 0; }
    #installed-overlay .chip {
      display: inline-block; margin-top: 24px;
      background: #F5A623; color: #07003B;
      border-radius: 30px; padding: 10px 24px;
      font-size: 14px; font-weight: 800;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>

  <div id="pwa-overlay"></div>

  <div id="installed-overlay">
    <img src="icons/Icon-192.png" alt="eSahlan">
    <h2>eSahlan Installed! 🎉</h2>
    <p>Please open eSahlan from your<br>home screen icon to continue.</p>
    <div class="chip">📱 Open from Home Screen</div>
  </div>

  <!-- Android Chrome -->
  <div id="android-banner" class="pwa-sheet">
    <div class="banner-row">
      <img src="icons/Icon-192.png" alt="eSahlan">
      <div>
        <strong>eSahlan</strong>
        <span>Somalia's Super App — Order food, shop, parcel &amp; more.</span>
      </div>
    </div>
    <button id="android-install-btn" class="install-btn">⬇️ &nbsp; Install App</button>
  </div>

  <!-- iOS — instruction card, browser-specific, set by JS -->
  <div id="ios-banner" class="pwa-sheet">
    <div class="banner-row">
      <img src="icons/Icon-192.png" alt="eSahlan">
      <div>
        <strong>eSahlan</strong>
        <span>Somalia's Super App — Order food, shop, parcel &amp; more.</span>
      </div>
    </div>
    <div class="ios-instruction">
      <div class="ios-tap-icon" id="ios-tap-icon">⬆️</div>
      <div class="ios-instr-text" id="ios-instr-text">
        Tap <b>⬆️</b> → <b>"Add to Home Screen"</b>
      </div>
    </div>
  </div>

  <script>
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches
                    || window.navigator.standalone === true;

    function isMobile() {
      return /android|iphone|ipad|ipod/i.test(navigator.userAgent);
    }
    function isIOS() {
      return /iphone|ipad|ipod/i.test(navigator.userAgent);
    }
    function showOverlay() {
      document.getElementById('pwa-overlay').style.display = 'block';
    }

    // Detect iOS browser and return icon + instruction text
    function getIOSInstruction() {
      var ua = navigator.userAgent;
      if (/CriOS/i.test(ua)) {
        // Chrome on iOS: three-dots menu at top-right
        return {
          icon: '⋯',
          html: 'Tap <b>⋯</b> (top right) → <b>"Add to Home Screen"</b>'
        };
      }
      if (/FxiOS/i.test(ua)) {
        // Firefox on iOS: menu at bottom-right
        return {
          icon: '☰',
          html: 'Tap <b>☰</b> (bottom right) → <b>"Add to Home Screen"</b>'
        };
      }
      if (/EdgiOS/i.test(ua)) {
        // Edge on iOS
        return {
          icon: '⋯',
          html: 'Tap <b>⋯</b> (bottom) → <b>"Add to Home Screen"</b>'
        };
      }
      // Safari (default for iOS)
      return {
        icon: '⬆️',
        html: 'Tap <b>⬆️</b> (bottom) → <b>"Add to Home Screen"</b>'
      };
    }

    if (isMobile() && !isStandalone) {

      // ── Android Chrome ──────────────────────────────────────────
      var deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        deferredPrompt = e;
        showOverlay();
        document.getElementById('android-banner').style.display = 'block';
      });
      document.getElementById('android-install-btn').addEventListener('click', function() {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(r) {
          deferredPrompt = null;
          if (r.outcome === 'accepted') {
            document.getElementById('android-banner').style.display = 'none';
            document.getElementById('pwa-overlay').style.display = 'none';
          }
        });
      });

      // ── iOS — show browser-specific one-line instruction ────────
      if (isIOS()) {
        var instr = getIOSInstruction();
        document.getElementById('ios-tap-icon').textContent  = instr.icon;
        document.getElementById('ios-instr-text').innerHTML  = instr.html;
        showOverlay();
        document.getElementById('ios-banner').style.display = 'block';
      }
    }

    window.addEventListener('appinstalled', function() {
      document.getElementById('android-banner').style.display = 'none';
      document.getElementById('pwa-overlay').style.display   = 'none';
      document.getElementById('installed-overlay').style.display = 'flex';
    });
  </script>
</body>
</html>
