name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deploy via webhook
        run: |
          curl -f -s -o /dev/null -w "HTTP %{http_code}" \
            -H "X-Deploy-Token: eSahlan_Deploy_2026_Secret" \
            "https://esahlan.com/api-sync"
