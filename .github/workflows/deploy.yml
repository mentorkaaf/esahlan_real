name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deploy via webhook
        run: |
          RESPONSE=$(curl -sL -w "\nHTTP_CODE:%{http_code}" \
            -H "X-Deploy-Token: eSahlan_Deploy_2026_Secret" \
            "https://esahlan.com/api-sync")
          echo "$RESPONSE" | tail -20
          CODE=$(echo "$RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
          if [ "$CODE" != "200" ]; then exit 1; fi
