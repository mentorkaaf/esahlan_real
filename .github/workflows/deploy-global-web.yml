name: Deploy Global Store Web (global.esahlan.com)

on:
  push:
    branches: [main]
    paths:
      - 'customer_app/lib/**'
      - 'customer_app/web/**'
      - 'customer_app/pubspec.yaml'
      - 'customer_app/pubspec.lock'

jobs:
  build-and-deploy:
    name: Flutter Web Build → VPS Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: customer_app
        run: flutter pub get

      - name: Build Flutter Web (release)
        working-directory: customer_app
        run: |
          flutter build web --release \
            --dart-define=FLUTTER_WEB_USE_SKIA=true \
            --web-renderer canvaskit

      - name: Copy global_index.html as index.html
        working-directory: customer_app
        run: |
          cp web/global_index.html build/web/index.html
          cp web/global_manifest.json build/web/global_manifest.json

      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: 168.144.117.91
          VPS_USER: root
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts

          # Sync Flutter web build to /var/www/esahlan/global/
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            customer_app/build/web/ \
            $VPS_USER@$VPS_HOST:/var/www/esahlan/global/

          # Set permissions
          ssh -i ~/.ssh/deploy_key $VPS_USER@$VPS_HOST \
            "chown -R www-data:www-data /var/www/esahlan/global/ && chmod -R 755 /var/www/esahlan/global/"

      - name: Notify on success
        if: success()
        run: echo "✅ global.esahlan.com deployed successfully"
