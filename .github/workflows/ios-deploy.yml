name: iOS — Build & Upload to TestFlight

on:
  workflow_dispatch:          # Manual trigger (you press "Run workflow")
  push:
    tags:
      - 'ios-v*'              # Auto-trigger: git tag ios-v1.0.0

jobs:
  build_ios:
    name: Build & Upload iOS
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Flutter setup ─────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      # ── 3. Flutter dependencies ──────────────────────────────────────────
      - name: Flutter pub get
        working-directory: customer_app
        run: flutter pub get

      # ── 3b. Patch livekit_client null-safety bug (Dart 3.6+ strict promotion) ──
      - name: Patch livekit_client null safety
        run: |
          FILE=$(find "$HOME/.pub-cache/hosted/pub.dev" \
            -path "*/livekit_client*/src/participant/local.dart" \
            2>/dev/null | head -1)
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "WARNING: livekit local.dart not found — skipping patch"
            exit 0
          fi
          cat > /tmp/patch_livekit.py << 'PYEOF'
import sys
path = sys.argv[1]
with open(path, 'r') as f:
    content = f.read()
content = content.replace('publishOptions.videoCodec', 'publishOptions!.videoCodec')
content = content.replace('publishOptions.degradationPreference', 'publishOptions!.degradationPreference')
content = content.replace('publishOptions.backupVideoCodec', 'publishOptions!.backupVideoCodec')
with open(path, 'w') as f:
    f.write(content)
print('livekit_client patched: ' + path)
PYEOF
          python3 /tmp/patch_livekit.py "$FILE"

      # ── 4. GoogleService-Info.plist (from GitHub Secret) ─────────────────
      - name: Write GoogleService-Info.plist
        working-directory: customer_app/ios/Runner
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > GoogleService-Info.plist

      # ── 5. Ruby + Fastlane ───────────────────────────────────────────────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: customer_app/ios

      # ── 6. Install certificates & profiles (via Fastlane Match) ──────────
      - name: Install signing certificates
        working-directory: customer_app/ios
        env:
          MATCH_PASSWORD:         ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTH:   ${{ secrets.MATCH_GIT_BASIC_AUTH }}
          APP_STORE_CONNECT_KEY_ID:         ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID:      ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT:    ${{ secrets.ASC_KEY_CONTENT }}
        run: bundle exec fastlane sync_signing

      # ── 7. Build & Upload ────────────────────────────────────────────────
      - name: Build iOS & Upload to TestFlight
        working-directory: customer_app/ios
        env:
          MATCH_PASSWORD:                   ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTH:             ${{ secrets.MATCH_GIT_BASIC_AUTH }}
          APP_STORE_CONNECT_KEY_ID:         ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID:      ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT:    ${{ secrets.ASC_KEY_CONTENT }}
          IOS_BUILD_NAME:                   ${{ github.ref_name || '1.0.0' }}
          IOS_BUILD_NUMBER:                 ${{ github.run_number }}
        run: bundle exec fastlane beta

      # ── 8. Upload IPA as artifact (backup) ──────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esahlan-customer-${{ github.run_number }}.ipa
          path: customer_app/build/ios/ipa/*.ipa
          retention-days: 30
