name: iOS — Build & Upload to TestFlight

on:
  workflow_dispatch:          # Manual trigger (you press "Run workflow")
  push:
    tags:
      - 'ios-v*'              # Auto-trigger: git tag ios-v1.0.0

jobs:
  build_ios:
    name: Build & Upload iOS
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Flutter setup ─────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ── 3. Flutter dependencies ──────────────────────────────────────────
      - name: Flutter pub get
        working-directory: customer_app
        run: flutter pub get

      # ── 3b. Patch livekit_client null-safety bug (affects Dart 3.6+) ──────
      - name: Patch livekit_client null safety
        run: |
          FILE="$HOME/.pub-cache/hosted/pub.dev/livekit_client-2.8.1/lib/src/participant/local.dart"
          if [ -f "$FILE" ]; then
            python3 -c "
import re, sys
with open('$FILE') as f:
    txt = f.read()
# Replace publishOptions. (without !) after await lines with publishOptions!.
txt = re.sub(r'\bpublishOptions\.', 'publishOptions!.', txt)
with open('$FILE', 'w') as f:
    f.write(txt)
print('livekit patch applied')
"
          fi

      # ── 4. GoogleService-Info.plist (from GitHub Secret) ─────────────────
      - name: Write GoogleService-Info.plist
        working-directory: customer_app/ios/Runner
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > GoogleService-Info.plist

      # ── 5. Ruby + Fastlane ───────────────────────────────────────────────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: customer_app/ios

      # ── 6. Install certificates & profiles (via Fastlane Match) ──────────
      - name: Install signing certificates
        working-directory: customer_app/ios
        env:
          MATCH_PASSWORD:         ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTH:   ${{ secrets.MATCH_GIT_BASIC_AUTH }}
          APP_STORE_CONNECT_KEY_ID:         ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID:      ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT:    ${{ secrets.ASC_KEY_CONTENT }}
        run: bundle exec fastlane sync_signing

      # ── 7. Build & Upload ────────────────────────────────────────────────
      - name: Build iOS & Upload to TestFlight
        working-directory: customer_app/ios
        env:
          MATCH_PASSWORD:                   ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTH:             ${{ secrets.MATCH_GIT_BASIC_AUTH }}
          APP_STORE_CONNECT_KEY_ID:         ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID:      ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT:    ${{ secrets.ASC_KEY_CONTENT }}
          IOS_BUILD_NAME:                   ${{ github.ref_name || '1.0.0' }}
          IOS_BUILD_NUMBER:                 ${{ github.run_number }}
        run: bundle exec fastlane beta

      # ── 8. Upload IPA as artifact (backup) ──────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esahlan-customer-${{ github.run_number }}.ipa
          path: customer_app/build/ios/ipa/*.ipa
          retention-days: 30
