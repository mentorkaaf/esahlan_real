workflows:
  ios-testflight:
    name: iOS — TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUILD_NUMBER: $PROJECT_BUILD_NUMBER
      groups:
        - ios_secrets

    scripts:
      - name: Flutter pub get
        script: |
          cd customer_app
          flutter pub get

      - name: Patch livekit_client null safety
        script: python3 customer_app/scripts/patch_livekit.py

      - name: Write GoogleService-Info.plist
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode \
            > customer_app/ios/Runner/GoogleService-Info.plist

      - name: Install Fastlane gems
        script: |
          cd customer_app/ios
          bundle install

      - name: Fastlane — sync signing & build & upload
        script: |
          cd customer_app/ios
          bundle exec fastlane beta

    artifacts:
      - customer_app/build/ios/ipa/*.ipa
