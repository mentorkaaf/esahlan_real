workflows:
  ios-testflight:
    name: iOS — TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUILD_NUMBER: $PROJECT_BUILD_NUMBER
      groups:
        - ios_secrets

    scripts:
      - name: Flutter pub get
        script: |
          cd customer_app
          flutter pub get

      - name: Patch livekit_client null safety
        script: python3 customer_app/scripts/patch_livekit.py

      - name: Write GoogleService-Info.plist
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode \
            > customer_app/ios/Runner/GoogleService-Info.plist

      - name: Install Fastlane gems
        script: |
          cd customer_app/ios
          bundle install

      - name: Fastlane — sync signing & build & upload
        script: |
          cd customer_app/ios
          bundle exec fastlane beta
        env:
          MATCH_PASSWORD: $MATCH_PASSWORD
          MATCH_GIT_BASIC_AUTH: $MATCH_GIT_BASIC_AUTH
          APP_STORE_CONNECT_KEY_ID: $ASC_KEY_ID
          APP_STORE_CONNECT_ISSUER_ID: $ASC_ISSUER_ID
          APP_STORE_CONNECT_KEY_CONTENT: $ASC_KEY_CONTENT
          IOS_BUILD_NUMBER: $BUILD_NUMBER
          IOS_BUILD_NAME: $PROJECT_BUILD_NUMBER
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "30"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "4"

    artifacts:
      - customer_app/build/ios/ipa/*.ipa
